# RQ4 on CICIDS2017 with controlled heterogeneity. alpha = 100 is the IID control
# that mirrors the setting of Aggarwal et al. [37]; signflip is the simple attack.
name: rq4_cicids
base: configs/base.yaml
seeds: [1, 2, 3]
fixed:
  data.source: cicids
  data.path: data/processed/cicids_sample.csv
  data.scale_cap: 1.0e9
  model.hidden: 64
  model.latent: 16
  privacy.track: B
  aggregation.rule: multikrum
  byzantine.clients: [client_00, client_05]
grid:
  data.dirichlet_alpha: [0.1, 0.5, 1.0, 100.0]
  byzantine.attack: [signflip, lie, minmax]
  privacy.B.noise_multiplier: [0.0, 1.0, 2.0, 5.0]
