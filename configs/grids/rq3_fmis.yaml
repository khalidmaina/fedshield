# RQ3 (f misestimation): two Byzantine clients; the aggregator assumes f = 1
# (underestimated), f = 2 (correct) or f = 3 (overestimated). Flat aggregation over
# all 12 clients, so every f here satisfies n >= 2f + 3.
name: rq3_fmis
base: configs/base.yaml
seeds: [1, 2, 3]
fixed:
  fl.hierarchy: flat
  aggregation.rule: multikrum
  byzantine.clients: [fs-dev-1, fs-web-1]
grid:
  byzantine.attack: [lie, minmax]
  aggregation.f: [1, 2, 3]
