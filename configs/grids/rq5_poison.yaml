# RQ5 (main question): normality poisoning. The compromised host(s) must have the
# target attack in their training pool; check with scripts/dataset_report.py.
name: rq5_poison
base: configs/base.yaml
seeds: [1, 2, 3]
fixed:
  poison.target_attack: beacon
  poison.start_round: 20
  poison.ramp_rounds: 5
  fl.rounds: 40
variants:
  one_host_no_dp: {poison.clients: [fs-build-2], privacy.track: none}
  one_host_B: {poison.clients: [fs-build-2], privacy.track: B, privacy.B.noise_multiplier: 1.0}
  one_host_A: {poison.clients: [fs-build-2], privacy.track: A, privacy.A.noise_multiplier: 1.0}
  two_hosts_no_dp: {poison.clients: [fs-build-2, fs-db-1], privacy.track: none}
grid:
  poison.pdr: [0.0, 0.05, 0.1, 0.2, 0.3, 0.5]
  aggregation.rule: [fedavg, krum, multikrum, distance_filter]
