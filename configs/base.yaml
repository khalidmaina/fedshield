# FedShield base configuration. Every experiment starts from these values.
# Override any value on the command line, e.g.  aggregation.rule=krum  privacy.track=B
name: base
seed: 1

data:
  source: host                          # host | cicids
  path: data/processed/host_windows.csv
  split: [0.6, 0.15, 0.25]              # train / validation / test, in time order (host data)
  scale_cap: 100000                     # data-independent scaling cap (host counts)
  # Only for source: cicids
  n_clients: 10
  dirichlet_alpha: 0.5
  n_clusters: 10
  max_benign_per_client: 20000
  max_attack_per_type: 3000

regions:                                # used when fl.hierarchy = hierarchical
  A: [fs-web-1, fs-web-2, fs-db-1, fs-db-2, fs-build-1, fs-dev-1]
  B: [fs-web-3, fs-db-3, fs-build-2, fs-build-3, fs-dev-2, fs-dev-3]
n_regions: 2                            # used when the regions above do not match the clients

model:
  hidden: 32
  latent: 8
  rho: 0.01                             # target sparsity
  beta: 0.1                             # sparsity weight
  lr: 0.001

fl:
  mode: federated                       # federated | local (each client alone)
  hierarchy: hierarchical               # hierarchical | flat
  rounds: 40
  local_epochs: 1
  batch_size: 64
  client_fraction: 1.0
  prox_mu: 0.0                          # > 0 turns FedAvg into FedProx (not used with Track A)

aggregation:
  rule: multikrum                       # fedavg | krum | multikrum | distance_filter
  place: regional                       # regional | global (all client updates at the coordinator)
  f: 1                                  # assumed Byzantine clients per group ("auto" = floor((n-3)/2))
  m: auto                               # Multi-Krum m; auto = n - f

privacy:
  track: none                           # none | A | B
  delta: 1.0e-5
  A: {noise_multiplier: 1.0, max_grad_norm: 1.0}
  B: {noise_multiplier: 1.0, clip: 1.0}

byzantine:                              # update-level attacks (RQ3, RQ4)
  clients: []                           # e.g. [fs-dev-1, fs-build-3]
  attack: none                          # none | gaussian | signflip | scale | lie | minmax | replacement
  scale: 10.0
  lie_z: 1.0                            # or "auto" for the formula of Baruch et al.
  knowledge: full                       # full | partial
  mimic_noise: true                     # under Track B, attackers add the same noise
  target_attack: beacon                 # behaviour the replacement backdoor hides

poison:                                 # normality poisoning (RQ5)
  clients: []                           # compromised hosts, e.g. [fs-web-1]
  target_attack: beacon
  pdr: 0.0                              # poisoned-data rate
  start_round: 20                      # model has converged before poisoning starts
  ramp_rounds: 5

detection:
  threshold_quantile: 0.99              # threshold = this quantile of benign validation scores
  alpha_grid: [0.0, 0.25, 0.5, 0.75, 1.0]
  if_trees: 100
  if_samples: 256

log_updates: false                      # save released updates for property inference (RQ6)
save_artifacts: false                   # save the model + detectors for live detection
out_dir: results
