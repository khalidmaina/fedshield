# FedShield testbed: 12 simulated hosts (4 roles x 3) + 1 lab C2 server.
# Start:  docker compose up -d --build      Stop: docker compose down
x-host: &host
  build: ./host
  image: fedshield-host:latest
  volumes:
    - ./attacks:/attacks:ro
  restart: unless-stopped
  mem_limit: 256m
  cpus: 0.5
  networks: [fsnet]

services:
  fs-web-1:
    <<: *host
    hostname: fs-web-1
    container_name: fs-web-1
    environment:
      ROLE: web
      INTENSITY: "2"
      PEER: fs-web-2
  fs-web-2:
    <<: *host
    hostname: fs-web-2
    container_name: fs-web-2
    environment:
      ROLE: web
      INTENSITY: "1"
      PEER: fs-web-3
  fs-web-3:
    <<: *host
    hostname: fs-web-3
    container_name: fs-web-3
    environment:
      ROLE: web
      INTENSITY: "3"
      PEER: fs-web-1
  fs-db-1:
    <<: *host
    hostname: fs-db-1
    container_name: fs-db-1
    environment:
      ROLE: db
      INTENSITY: "1"
  fs-db-2:
    <<: *host
    hostname: fs-db-2
    container_name: fs-db-2
    environment:
      ROLE: db
      INTENSITY: "2"
  fs-db-3:
    <<: *host
    hostname: fs-db-3
    container_name: fs-db-3
    environment:
      ROLE: db
      INTENSITY: "3"
  fs-build-1:
    <<: *host
    hostname: fs-build-1
    container_name: fs-build-1
    environment:
      ROLE: build
      INTENSITY: "1"
  fs-build-2:
    <<: *host
    hostname: fs-build-2
    container_name: fs-build-2
    environment:
      ROLE: build
      INTENSITY: "2"
  fs-build-3:
    <<: *host
    hostname: fs-build-3
    container_name: fs-build-3
    environment:
      ROLE: build
      INTENSITY: "1"
  fs-dev-1:
    <<: *host
    hostname: fs-dev-1
    container_name: fs-dev-1
    environment:
      ROLE: dev
      INTENSITY: "2"
  fs-dev-2:
    <<: *host
    hostname: fs-dev-2
    container_name: fs-dev-2
    environment:
      ROLE: dev
      INTENSITY: "1"
  fs-dev-3:
    <<: *host
    hostname: fs-dev-3
    container_name: fs-dev-3
    environment:
      ROLE: dev
      INTENSITY: "3"
  c2-server:
    image: fedshield-host:latest
    hostname: c2-server
    container_name: c2-server
    command: ["python3", "/c2/c2.py"]
    volumes:
      - ./c2:/c2:ro
    restart: unless-stopped
    mem_limit: 128m
    networks: [fsnet]
    depends_on: [fs-web-1]

networks:
  fsnet:
    driver: bridge
